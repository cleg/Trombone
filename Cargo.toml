[package]
name = "trombone"
version = "0.1.0"
edition = "2024"

[dependencies]
blake3 = "1.8.7"
clap = { version = "4.6.7", features = ["derive"] }
indicatif = "0.18.6"
ollama-rs = "0.3.6"
pulldown-cmark = "0.13.6"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1", features = ["rt"] }
toml = "1.1.8"
usearch = "2.26.6"
walkdir = "2.5.0"

[[bin]]
name = "tb"
path = "src/main.rs"
